# Trivy secret-scanner config (picked up by default from the working directory).
# The anthropic SDK (>=1.14) documents a placeholder service-account principal
# in several beta Managed Agents docstrings (agents.py, agent_*_params.py,
# beta_managed_agents_session*_agent.py) that the gcp-service-account rule
# misreads as a key. It is vendor library text, not a credential. Scoped to the
# installed anthropic package so real secrets anywhere else still fail the scan.
allow-rules:
  - id: anthropic-sdk-docstring-false-positive
    description: anthropic SDK docstrings matched by gcp-service-account rule
    path: .*/site-packages/anthropic/.*\.py
