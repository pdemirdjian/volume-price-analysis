name: Docker

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g., v1.4.0) to tag as latest + semver'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version
        id: version
        if: inputs.version
        env:
          TAG: ${{ inputs.version }}
        run: |
          V="${TAG#v}"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "major_minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/pdemirdjian/volume-price-analysis
          tags: |
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha,prefix=
            type=raw,value=${{ steps.version.outputs.full }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
