name: Cleanup

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly, Sunday 6 AM UTC

permissions:
  packages: write

jobs:
  prune-images:
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@3b0972b2276b171b212f8c4efbca59ebba26eceb # v3.0.1
        with:
          account: pdemirdjian
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: volume-price-analysis
          tag-selection: both
          cut-off: 4w
          keep-n-most-recent: 10
