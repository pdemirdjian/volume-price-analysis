name: Security re-scan

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.0 # renovate: datasource=github-releases depName=aquasecurity/trivy
          image-ref: ghcr.io/pdemirdjian/volume-price-analysis:latest
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  dependencies:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit locked dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0 # renovate: datasource=github-releases depName=aquasecurity/trivy
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
