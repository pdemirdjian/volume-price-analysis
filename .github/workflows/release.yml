name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

  # Run CI on release-please PRs (GITHUB_TOKEN PRs don't trigger other workflows)
  ci:
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.pr_branch }}

  # Mirror CI results to the release-please PR so branch protection sees them
  report-ci-status:
    needs: [release-please, ci]
    if: always() && needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report CI status to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          CI_RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/$PR_BRANCH" --jq '.object.sha')
          STATE="failure"
          if [ "$CI_RESULT" = "success" ]; then STATE="success"; fi
          for CONTEXT in test docker-build; do
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$STATE" \
              -f context="$CONTEXT" \
              -f description="CI from release workflow" \
              -f target_url="$RUN_URL"
          done

  # Build and push Docker image on releases (GITHUB_TOKEN tags don't trigger other workflows)
  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
