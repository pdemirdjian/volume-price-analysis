name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

  # Run CI on release-please PRs (GITHUB_TOKEN PRs don't trigger other workflows)
  ci:
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.pr_branch }}
