[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volume-price-analysis-mcp"
version = "2.7.4"
description = "MCP server for stock volume-price analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==1.29.0",
    "yfinance==1.6.0",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "anthropic~=0.121.0",
    "google-genai~=2.18.0",
    "markdown~=3.10.0",
    "holidays~=0.91",
    "pytickersymbols~=1.17.0",
    "nh3~=0.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/volume_price_analysis"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    # Parallelize across CPU cores (pytest-xdist). Coverage still aggregates
    # correctly across workers via pytest-cov. Override with `-p no:xdist` or
    # `-n 0` when debugging a single test.
    "-n=auto",
    "--cov=src/volume_price_analysis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[project.scripts]
volume-price-analysis = "volume_price_analysis.server:main"
morning-briefing = "volume_price_analysis.agent.morning_agent:main"
morning-scheduler = "volume_price_analysis.agent.scheduler:main"
vpa-backtest = "volume_price_analysis.backtest:main"
