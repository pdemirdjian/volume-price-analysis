[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volume-price-analysis-mcp"
version = "2.5.32"
description = "MCP server for stock volume-price analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==1.28.0",
    "yfinance==1.4.1",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "anthropic~=0.112.0",
    "google-genai~=2.10.0",
    "markdown~=3.10.0",
    "holidays~=0.91",
    "pytickersymbols~=1.17.0",
    "nh3~=0.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/volume_price_analysis"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.18",
    "mypy==2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/volume_price_analysis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.uv]
# Security override: force curl-cffi>=0.15.0,<0.16 to patch CVE-2026-33752 (SSRF via redirect).
# yfinance 1.2.0 pins curl_cffi<0.14, blocking the fix. Capped at <0.16 to match this project's
# tight-pinning policy and limit unvetted compatibility risk with yfinance.
# NOTE: this override is uv-only; pip installs remain constrained by yfinance's <0.14 upper bound.
# TODO: remove this override once yfinance relaxes its curl_cffi<0.14 upper bound.
#   Track: https://github.com/ranaroussi/yfinance/issues/2737
#   Before removing: verify by running yfinance's own test suite on macOS with curl-cffi 0.15.0.
override-dependencies = ["curl-cffi>=0.15.0,<0.16"]

[project.scripts]
volume-price-analysis = "volume_price_analysis.server:main"
morning-briefing = "volume_price_analysis.agent.morning_agent:main"
morning-scheduler = "volume_price_analysis.agent.scheduler:main"
vpa-backtest = "volume_price_analysis.backtest:main"
