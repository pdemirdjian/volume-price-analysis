[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license-files support
build-backend = "hatchling.build"

[project]
name = "volume-price-analysis-mcp"
version = "2.14.5"
description = "MCP server for stock volume-price analysis"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Demirdjian" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "stock-market",
    "technical-analysis",
    "volume-price-analysis",
    "trading",
    "yfinance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# Pinning strategy: uv.lock pins exact versions for reproducible dev/CI/Docker builds, so
# these stay compatible ranges (never `==`) to let wheel consumers resolve alongside other
# packages. Floors track the locked versions; ceilings stop at the next breaking release.
dependencies = [
    "mcp>=2.3.0,<3",
    "yfinance>=1.7.0,<2",
    "pandas>=3.1.0,<4",
    "numpy>=2.5.4,<3",
    "anthropic~=2.3.0",
    "google-genai~=2.33.0",
    "markdown~=3.11.0",
    "holidays~=0.91",
    "pytickersymbols~=1.17.0",
    "nh3~=0.3.3",
]

[project.urls]
Homepage = "https://github.com/pdemirdjian/volume-price-analysis"
Repository = "https://github.com/pdemirdjian/volume-price-analysis"
Issues = "https://github.com/pdemirdjian/volume-price-analysis/issues"
Changelog = "https://github.com/pdemirdjian/volume-price-analysis/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/volume_price_analysis"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1",
    "pytest-mock==3.17.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest-xdist==3.8.0",
    "pytest-socket==0.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    # Allow loopback connections for Windows asyncio/xdist; block non-loopback hosts.
    "--allow-hosts=127.0.0.1,::1",
    "--allow-unix-socket",
    # Parallelize across CPU cores (pytest-xdist). Coverage still aggregates
    # correctly across workers via pytest-cov. Override with `-p no:xdist` or
    # `-n 0` when debugging a single test.
    "-n=auto",
    "--cov=src/volume_price_analysis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
markers = [
    "integration: requires real network access; run with --run-integration",
]

[tool.coverage.run]
branch = true
source = ["src/volume_price_analysis"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
    "if __name__ == \"__main__\":",
    # Standalone ellipsis bodies in the DataSource protocol.
    '^\s*\.\.\.\s*$',
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[project.scripts]
volume-price-analysis = "volume_price_analysis.server:cli"
morning-briefing = "volume_price_analysis.agent.morning_agent:main"
morning-scheduler = "volume_price_analysis.agent.scheduler:main"
morning-healthcheck = "volume_price_analysis.agent.healthcheck:main"
vpa-backtest = "volume_price_analysis.backtest:main"

# These installed packages do not ship typing metadata.
[[tool.mypy.overrides]]
module = ["pandas", "yfinance", "yfinance.*", "pytickersymbols"]
ignore_missing_imports = true
