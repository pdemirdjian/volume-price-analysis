services:
  morning-briefing:
    image: ghcr.io/pdemirdjian/volume-price-analysis:latest@sha256:d83c4025265d90409cf46a5a3ded5399b023b6001a910f5d92b02a08d9ff99f3
    container_name: morning-briefing
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/New_York

  # Watchtower auto-pulls new images from ghcr.io and restarts the container.
  # NOTE: Docker socket access is required for Watchtower to function.
  # It is scoped to only monitor the morning-briefing container (see command).
  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for authenticated pulls from ghcr.io private packages
      - /root/.docker/config.json:/config.json:ro
    command: --interval 3600 morning-briefing
    restart: unless-stopped
